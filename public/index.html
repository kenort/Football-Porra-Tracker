<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Porra Tracker</title>
  <meta name="description" content="Redirigiendo al sistema de porras..." />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="icon" href="icon-ball.svg" type="image/svg+xml" />
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <script>
    (async function routeEntry() {
      try {
        const response = await fetch("/api/bootstrap", { credentials: "same-origin" });
        const payload = await response.json();
        const target = payload?.authenticated ? "/dashboard" : "/login";
        window.location.replace(target);
      } catch {
        window.location.replace("/login");
      }
    }());
  </script>
</head>
