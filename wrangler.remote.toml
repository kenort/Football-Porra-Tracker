name = "football-porra-tracker"
main = "src/worker.js"
compatibility_date = "2026-04-03"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "football-porra"
database_id = "b0091f10-46b9-49c7-b3e0-a161eedd9b6d"
migrations_dir = "./migrations"
remote = true

[[kv_namespaces]]
binding = "APP_CACHE"
id = "eacf423d6e2d4711bbfd3ba16aba1610"
remote = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "football-porra-media"
remote = true

[[queues.producers]]
binding = "PREDICTION_QUEUE"
queue = "football-porra-predictions"

[[queues.consumers]]
queue = "football-porra-predictions"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 5

[vars]
ENABLE_PREDICTION_QUEUE = "true"

[triggers]
crons = ["0 * * * *"]
